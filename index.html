<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101114">
  <title>Video Hub</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#"><span class="brand-mark">▶</span> Video Hub</a>
    <nav><button class="nav active" data-view="home">首页</button><button class="nav" data-view="categories">分类</button></nav>
    <form id="searchForm"><input id="searchInput" placeholder="搜索视频…" aria-label="搜索视频"><button>搜索</button></form>
  </header>
  <main>
    <section class="hero">
      <div><p class="eyebrow">YOUR VIDEO LIBRARY</p><h1>发现值得观看的内容</h1><p class="sub">整理和播放你拥有或获准传播的视频。</p></div>
      <span class="hero-icon">▶</span>
    </section>
    <div class="section-head"><div><h2 id="sectionTitle">精选视频</h2><p id="resultCount">视频目录</p></div>
      <select id="categoryFilter" aria-label="筛选分类"><option value="">全部分类</option></select>
    </div>
    <section id="grid" class="grid" aria-live="polite"></section>
    <section id="empty" class="empty" hidden><div class="empty-icon">▣</div><h3>还没有视频</h3><p>把你拥有或获准使用的视频加入 <code>videos.json</code>，然后重新部署。</p></section>
  </main>
  <dialog id="playerDialog"><div class="player-head"><strong id="playerTitle">正在播放</strong><button id="closePlayer" aria-label="关闭">✕</button></div><video id="player" controls playsinline></video><p class="player-note">请仅播放你拥有或已获授权使用的媒体。</p></dialog>
  <footer>Video Hub · 个人视频目录</footer>
  <script src="/app.js"></script>
</body>
</html>
